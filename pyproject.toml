[project]
name = "fr2en"
version = "0.1.0"
description = "Translate French technical documentation into English PDFs (DeepL + Typst)."
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "deepl>=1.18",
]

[project.scripts]
fr2en = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
